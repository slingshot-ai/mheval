task: eqbench3
tag: [quality]
source:
  - repo: https://github.com/EQ-bench/eqbench3
    commit: affc5a000bbdb965b807e09ca7875f8530fa8f56
env:
  python: "3.12"
  install:
    - uv pip install -r requirements.txt
roles:
  judge: {model: anthropic/claude-opus-4.6, base_url: https://openrouter.ai/api/v1, api_key_env: OPENROUTER_API_KEY}  # README default: Claude Opus 4.6
generation_kwargs: {}  # sampling is fixed in core/conversation.py (temperature 0.7, min_p 0.1)
task_args:
  elo: true  # pairwise ELO against the bundled canonical leaderboard (many judge calls)
  iterations: 1
  threads: 8
env_vars:
  TEST_API_URL: "{{ target.base_url }}/chat/completions"
  TEST_API_KEY: "{{ env.TARGET_API_KEY }}"
  JUDGE_API_URL: "{{ judge.base_url }}/chat/completions"
  JUDGE_API_KEY: "{{ env.JUDGE_API_KEY }}"
command: |
  # --limit is not supported: the benchmark always runs all 45 scenarios
  python eqbench3.py --test-model {{ target.model }} --model-name mheval-target \
    --judge-model {{ judge.model }} --run-id mheval \
    --runs-file {{ output_dir }}/eqbench3_runs.json --elo-results-file {{ output_dir }}/elo_results.json \
    --iterations {{ args.iterations }} --threads {{ args.threads }} {{ "" if args.elo else "--no-elo" }}
  python {{ task_dir }}/summarize.py {{ output_dir }}/eqbench3_runs.json {{ output_dir }}/elo_results.json mheval-target
process_results: null  # summarize.py writes results.json
metric_list:
  - {metric: rubric_score, higher_is_better: true}
  - {metric: elo_normalized, higher_is_better: true}
metadata:
  version: 3.0
  description: Emotional intelligence in 45 multi-turn role-play, message-drafting and analysis scenarios; rubric score and pairwise ELO.
  paper: null
  homepage: https://github.com/EQ-bench/eqbench3
  implementation: original
